<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATS Ink | Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">ATS INK</a><nav><a href="/">View Website</a><button id="logout" class="link hidden">Log Out</button></nav></header><main class="admin"><h1>Studio Admin Panel</h1><p class="muted">Only the studio owner can add, edit or remove designs.</p><section id="loginArea" class="panel"><h2>Owner Login</h2><form id="loginForm"><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button">Log In</button></form></section><div id="editorArea" class="hidden"><section class="panel"><h2 id="formHeading">Add a Tattoo Design</h2><form id="designForm"><label>Design Name<input name="name" maxlength="100" required placeholder="e.g. Minimal Rose"></label><label>Price (₹)<input name="price" type="number" min="0" max="10000000" step="1" required placeholder="1500"></label><label>Description<textarea name="description" maxlength="300" rows="3" placeholder="Size, style, details"></textarea></label><label>Photo (JPG, PNG, WEBP, max 5 MB)<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="actions"><button class="button" id="saveButton">Save Design</button><button class="button secondary hidden" type="button" id="cancelEdit">Cancel Edit</button></div></form></section><section><h2>Manage Designs</h2><div id="items" class="grid"></div></section></div><p id="message" role="status" aria-live="polite"></p></main><script src="/admin.js"></script></body></html>
